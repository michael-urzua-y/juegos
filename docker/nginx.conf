# Sirve la PWA compilada. Las cabeceras de seguridad se generan en el build
# desde config/security.ts, así hay una sola fuente para todos los despliegues.

server_tokens off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # El service worker y el manifest deben revisarse siempre para recibir actualizaciones.
    location ~ ^/(sw\.js|registerSW\.js|sw-notify\.js)$ {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires -1;
    }

    # API (contenedor turnos-api, solo en la red interna). Se resuelve en cada petición:
    # si la API está detenida, /api responde 502 y la app sigue cargando.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://turnos-api:8081;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP del cliente: la que puso el proxy de entrada (red interna de Docker) o la de la conexión
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Real-IP;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        # La API ya envía estas cabeceras; se evitan duplicados
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        client_max_body_size 3m;
        # Sin "expires": se respeta el Cache-Control: no-store de la API (datos privados)
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No servir archivos ocultos ni el _headers de Cloudflare/Netlify.
    location ~ /(\.|_headers) {
        deny all;
        return 404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
