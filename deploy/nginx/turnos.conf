# Virtual host para el nginx existente del VPS (se copia a su carpeta conf.d).
# Cloudflare (modo Full) → este nginx → contenedor turnos-web.

server {
    listen 80;
    server_name turnos.serviciohyh.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name turnos.serviciohyh.cl;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1M;

    # El upstream se resuelve en cada petición (DNS interno de Docker) y no al arrancar:
    # si turnos-web está detenido, solo este sitio responde 502 y nginx sigue en pie
    # para los demás dominios.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $turnos_upstream http://turnos-web:8080;

    location / {
        proxy_pass $turnos_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
