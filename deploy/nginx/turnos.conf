# Virtual host para el nginx existente del VPS (se copia a su carpeta conf.d).
# Cloudflare (modo Full) → este nginx → contenedor turnos-web.

server {
    listen 80;
    server_name turnos.serviciohyh.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name turnos.serviciohyh.cl;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 3M;

    # IP real del visitante: se acepta CF-Connecting-IP solo si la conexión viene de Cloudflare.
    # Quien entre directo a la IP del servidor no puede falsificarla.
    # Rangos: https://www.cloudflare.com/ips/ (revisar si Cloudflare los cambia)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # El upstream se resuelve en cada petición (DNS interno de Docker) y no al arrancar:
    # si turnos-web está detenido, solo este sitio responde 502 y nginx sigue en pie
    # para los demás dominios.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $turnos_upstream http://turnos-web:8080;

    location / {
        proxy_pass $turnos_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
